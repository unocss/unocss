name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  merge_group: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node_version: [22, lts/*]
        include:
          - os: macos-latest
            node_version: lts/*
          - os: windows-latest
            node_version: lts/*
      fail-fast: false

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node ${{ matrix.node_version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Build for macOS
        if: runner.os == 'macOS'
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          pnpm build

      - name: Build
        if: runner.os != 'macOS'
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

  vite-compat:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        vite_version: [6, 7, 8]

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Install Vite ${{ matrix.vite_version }}
        run: |
          pnpm add -Dw vite@${{ matrix.vite_version }} --ignore-scripts
          pnpm --filter @unocss/vite add -D vite@${{ matrix.vite_version }} --ignore-scripts

      - name: Test Vite ${{ matrix.vite_version }} compatibility
        run: |
          pnpm exec vite --version
          pnpm exec vitest run test/virtual-modules.test.ts --testNamePattern 'updates global CSS through Vite'
