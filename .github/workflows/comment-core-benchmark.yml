name: Comment core benchmark

on:
  workflow_run:
    workflows: [Core benchmark]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: core-benchmark-comment-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && contains(fromJSON('["success", "failure", "timed_out"]'), github.event.workflow_run.conclusion)
      && github.event.workflow_run.path == '.github/workflows/benchmark.yml'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Only execute scripts from the trusted default branch, never PR code.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: core-benchmark-comment
          path: ${{ runner.temp }}/core-benchmark-comment

      - name: Create unocss-bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.UNOCSS_BOT_APP_ID }}
          private-key: ${{ secrets.UNOCSS_BOT_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Update benchmark comment
        uses: actions/github-script@v8
        env:
          BENCHMARK_REPORT_DIR: ${{ runner.temp }}/core-benchmark-comment
          BENCHMARK_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { pathToFileURL } = require('node:url')
            const script = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/comment-core-benchmark.mjs`)
            const { default: comment } = await import(script.href)
            await comment({ github, context, core })
