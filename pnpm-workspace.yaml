ignoreWorkspaceRootCheck: true
catalogMode: prefer
cleanupUnusedCatalogs: true
minimumReleaseAge: 0
trustPolicy: off

update:
  ignoreDeps:
    - typescript@7

autoInstallPeers: true
dedupePeers: true
strictPeerDependencies: false
shellEmulator: true

packages:
  - bench
  - bench/fixtures/*
  - docs
  - playground
  - interactive
  - packages-engine/*
  - packages-integrations/*
  - packages-presets/*
  - packages-deprecated/*
  - virtual-shared/*
  - test/fixtures/*

overrides:
  # 1.2.6 assumes the newer @emnapi/core plugin API while
  # @oxc-parser/binding-wasm32-wasip1 still pins 2.0.0-alpha.3
  '@napi-rs/wasm-runtime': 1.2.5
  fflate: 0.8.2
  is-arguments: npm:@nolyfill/is-arguments@^1.0.44
  is-core-module: npm:@nolyfill/is-core-module@^1.0.39
  is-generator-function: npm:@nolyfill/is-generator-function@^1.0.44
  is-regex: npm:@nolyfill/is-regex@^1.0.44
  is-typed-array: npm:@nolyfill/is-typed-array@^1.0.44
  object.assign: npm:@nolyfill/object.assign@^1.0.44
  side-channel: npm:@nolyfill/side-channel@^1.0.44
  twoslash: ^0.3.9
  twoslash-vue: ^0.3.9
  which-typed-array: npm:@nolyfill/which-typed-array@^1.0.44

allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  core-js: true
  esbuild: true
  msw: true
  nuxt-tsconfig-stub: true
  pnpm: true
  sharp: true
  simple-git-hooks: true

